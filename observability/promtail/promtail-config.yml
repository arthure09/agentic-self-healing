# Ambil log semua container lewat Docker API (service discovery).
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream

  # Hasil pengujian (benchmark/runs/*.jsonl) untuk dashboard "Aktivitas Agent".
  # Label `kind`: actions (tool agent), alerts (alert-bridge), events (chaos/reset).
  # ponytail: Loki hanya menyimpan 7 hari (retention 168h); arsip tetap file JSONL.
  - job_name: runs
    static_configs:
      - targets: [localhost]
        labels: {job: runs, kind: actions, __path__: /runs/actions.jsonl}
      - targets: [localhost]
        labels: {job: runs, kind: alerts, __path__: /runs/alerts.jsonl}
      - targets: [localhost]
        labels: {job: runs, kind: events, __path__: /runs/events.jsonl}
    pipeline_stages:
      - json:
          expressions: {ts_ms: ts_ms, bridge_ms: bridge_received_ms, fwd_ms: forward_done_ms, tool: tool, event: event, scenario: scenario}
      # Waktu log = waktu kejadian, bukan waktu dibaca Promtail.
      - template:
          source: ts
          template: '{{ if .ts_ms }}{{ .ts_ms }}{{ else if .fwd_ms }}{{ .fwd_ms }}{{ else }}{{ .bridge_ms }}{{ end }}'
      - timestamp: {source: ts, format: UnixMs}
      - labels: {tool: "", event: "", scenario: ""}
