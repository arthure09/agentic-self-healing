# Semua alert diteruskan ke alert-bridge (Stage 6), yang mencatat timestamp
# dan meneruskannya ke OpenClaw.
route:
  receiver: alert-bridge
  group_by: ["alertname", "scenario"]
  group_wait: 0s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: alert-bridge
    webhook_configs:
      - url: http://alert-bridge:5001/alertmanager
        send_resolved: true
        max_alerts: 0
