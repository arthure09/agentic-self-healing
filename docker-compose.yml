# Stack pengujian agent remediasi. Semua secret dibaca dari .env (lihat .env.example).
# Docker melewati ufw: port internal di-bind ke 127.0.0.1, UI hanya ke IP Tailscale.
name: agentic

networks:
  agentic-net:
    driver: bridge

volumes:
  pgdata:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  promtail-positions:

services:
  # ---------------------------------------------------------------------------
  # Layer 1: aplikasi target
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.15-alpine3.24
    container_name: medusa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # max_connections=50 sengaja rendah agar TC-01 (connection pool exhaustion)
    # mudah dipicu. Log lock wait/deadlock untuk TC-02.
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=128MB
      -c log_lock_waits=on
      -c deadlock_timeout=1s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [agentic-net]

  redis:
    image: redis:7.4.11-alpine3.21
    container_name: medusa-redis
    restart: unless-stopped
    # maxmemory 256mb untuk TC-03 (ambang alert 85%). noeviction dipilih agar
    # flood benar-benar memenuhi memori dan menggagalkan write aplikasi, bukan
    # diam-diam meng-evict key milik Medusa seperti allkeys-lru.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [agentic-net]

  medusa:
    build:
      context: ./app/medusa
    image: agentic/medusa:2.20.1
    container_name: medusa-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${MEDUSA_JWT_SECRET}
      COOKIE_SECRET: ${MEDUSA_COOKIE_SECRET}
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://${TAILSCALE_IP}:9000
      AUTH_CORS: http://${TAILSCALE_IP}:9000
      MEDUSA_ADMIN_EMAIL: ${MEDUSA_ADMIN_EMAIL}
      MEDUSA_ADMIN_PASSWORD: ${MEDUSA_ADMIN_PASSWORD}
    ports:
      - "${TAILSCALE_IP}:9000:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Migrasi + seed pertama kali butuh beberapa menit
      start_period: 600s
    networks: [agentic-net]

  # ---------------------------------------------------------------------------
  # Layer 2: observability
  # Exporter tidak dipublikasikan ke host; hanya diakses Prometheus lewat
  # jaringan compose. Prometheus/Alertmanager/Loki hanya di 127.0.0.1.
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on: [postgres]
    networks: [agentic-net]

  redis-exporter:
    image: oliver006/redis_exporter:v1.92.1
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on: [redis]
    networks: [agentic-net]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --housekeeping_interval=5s
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [agentic-net]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks: [agentic-net]

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [postgres-exporter, redis-exporter, cadvisor, node-exporter]
    networks: [agentic-net]

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    depends_on: [alert-bridge]
    networks: [agentic-net]

  # alert-bridge: webhook Alertmanager -> benchmark/runs/alerts.jsonl + OpenClaw
  # (Gateway berjalan di host, dijangkau lewat host.docker.internal).
  alert-bridge:
    build:
      context: ./alert-bridge
    image: agentic/alert-bridge:1.0.0
    container_name: alert-bridge
    restart: unless-stopped
    # uid/gid pemilik repo agar file JSONL bisa dibaca/dihapus tanpa sudo
    user: "1000:1000"
    environment:
      OPENCLAW_HOOK_URL: ${OPENCLAW_HOOK_URL}
      OPENCLAW_HOOK_TOKEN: ${OPENCLAW_HOOK_TOKEN}
      OPENCLAW_AGENT_ID: ${OPENCLAW_AGENT_ID}
      ALERT_LOG_FILE: /data/alerts.jsonl
    volumes:
      - ./benchmark/runs:/data
    ports:
      - "127.0.0.1:5001:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [agentic-net]

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [agentic-net]

  promtail:
    image: grafana/promtail:3.6.11
    container_name: promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/var/lib/promtail
    depends_on: [loki]
    networks: [agentic-net]

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://${TAILSCALE_IP}:3000
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ringkasan.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${TAILSCALE_IP}:3000:3000"
    depends_on: [prometheus, loki, alertmanager]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [agentic-net]
