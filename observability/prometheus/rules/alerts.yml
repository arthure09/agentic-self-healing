groups:
- name: example
  rules:
  - alert: PostgresDown
    expr: pg_up == 0
    for: 5s
    labels:
      scenario : tc04
      severity: critical
    annotations:
      summary: "PostgreSQL mati"
      description: "database PostgreSQL tidak bisa dihubungi."

  - alert: RedisDown
    expr: redis_up == 0
    for: 5s
    labels:
      scenario : tc04
      severity: critical
    annotations:
      summary: "redis mati"
      description: "Redis tidak bisa dihubungi"

  - alert : PostgresConnectionPoolExhaustion
    expr: sum(pg_stat_activity_count) / scalar(pg_settings_max_connections) > 0.85
    for : 10s
    labels:
      scenario : tc01
      severity : warning
    annotations :
      summary : "koneksi ke database PostgreSQL hampir habis"
      description : "koneksi terpakai {{ $value | humanizePercentage }} dari batas maksimal"

  - alert: PostgresDeadlockDetected
    expr: sum(increase(pg_stat_database_deadlocks[1m])) > 0
    for: 0s
    labels:
      scenario: tc02
      severity: warning
    annotations:
      summary: "Deadlock terdeteksi di PostgreSQL"
      description: "Terjadi {{ $value | printf \"%.0f\" }} deadlock dalam 1 menit terakhir."

  - alert: RedisMemoryHigh
    expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
    for: 5s
    labels:
      scenario: tc03
      severity: warning
    annotations:
      summary: "Memori Redis hampir penuh"
      description: "Memori Redis terpakai {{ $value | humanizePercentage }} dari batas 256 MB."


